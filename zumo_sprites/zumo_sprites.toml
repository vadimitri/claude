# Zumo-Sprites: alle Gestaltungswerte. Logik steht in src/zumo_sprites.py, Handbuch in zumo_sprites/CLAUDE.md.
# Werte (Stufen) 0..5 = Wertraum des Systems (Grund -> Tinte), Farbe kommt erst ueber die Palette.

[source]
glb = "~/Movies/ZumoWire/zumo.glb"   # nur fuer `mesh` (STEP -> glb macht ~/Movies/ZumoWire/zumo_wire.py)

[render]
model = "toy"               # "toy" = vereinfachtes Modell mit STEP-Massen (saubere Formen), "cad" = echtes STEP-Mesh
mm_per_px = 2.0             # Massstab: 2 mm echter Zumo pro Sprite-Pixel -> Draufsicht ~50 px
supersample = 6             # Abtastungen pro Pixel und Achse (36 pro Pixel) fuer Kanten und Materialwahl
coverage_frac = 0.45        # ab diesem Anteil getroffener Abtastungen ist ein Pixel deckend
light = [-0.5, 0.6, 0.7]    # Lichtrichtung im Bild (rechts, oben, zur Kamera): oben links vorne, fest fuer alle Ansichten.
                            # So: Deckel hell, Seite zur Kamera mittel, rechte Flanke Schatten (drei lesbare Flaechen in 3/4)
bands = [0.15, 0.62]        # n.L-Schwellen: darunter Schatten, darueber Licht (Cel-Shading, drei Baender)
line_mm = 5.0               # Tiefensprung zum Nachbarn, ab dem der hintere Pixel eine Innenlinie (Stufe 0) wird
outline = true              # 1 px Kontur um die Silhouette
outline_value = 0           # Stufe der Kontur: 0 = dunkel (klassisch), 3..5 = Sticker-Kontur fuer dunkle Gruende
despeckle = true            # Einzelpixel, die zu keinem Nachbarn passen, nehmen den haeufigsten Nachbarwert an
margin_px = 3               # Rand um den Sprite (Kontur + Hopser bis 2 px)
track_band_mm = 4.5         # Kette optisch so dick (echte Kette ~1 mm im CAD, mit Stollen ~4 mm): liest sich als Band
hide = ["part", "screw"]    # Materialien, die nicht gerendert werden (SMD-Bauteile, Schrauben: nur Rauschen bei 2 mm/px)
min_island_px = 3           # Material-Flecken kleiner als das gehen im Umfeld auf
value_island_px = 3         # Wert-Inseln (Licht, Linie, Vertiefung) kleiner als das gehen im Umfeld auf (0 = aus)
island_keep = ["screen", "lens", "cap", "bolt", "usb"]   # ... ausser diese (kleine Akzente sind gewollt)
cavity_mm = 4.0             # Vertiefung: so viel tiefer als der naechste Punkt im Umkreis -> eine Stufe dunkler
cavity_px = 2               # Umkreis dafuer (Radius in Pixeln)
thin = {steel = 0.12}       # Mindestdeckung pro Material: 1 mm Schild von der Seite bleibt als 1-px-Linie stehen
rim = true                  # Lichtkante: Pixel, deren Nachbar oben/links tiefer liegt oder frei ist, eine Stufe heller

# tidy = Pixel-Art-Bereinigung (Vertiefung nur konkav, Wert-Inseln < value_island_px weg): Vadim 8.10. "manche 3/4 sehen
# nur verpixelt aus". Nur 3/4; Draufsicht, Seite, Front bleiben wie abgenommen.
# Ansichten: pitch = Blick von oben (0 = Seite, 90 = Draufsicht), dirs = Fahrtrichtung im Bild (0 = rechts, 90 = weg/oben,
# 270 = zur Kamera). 3/4 mit pitch 30 und dirs in 45-Grad-Schritten ist zugleich echtes 2:1-Iso.
[views.top]
tidy = false
pitch_deg = 90
dirs_deg = [0, 22.5, 45, 67.5, 90, 112.5, 135, 157.5, 180, 202.5, 225, 247.5, 270, 292.5, 315, 337.5]
[views.tq]
tidy = true
pitch_deg = 30
dirs_deg = [0, 45, 90, 135, 180, 225, 270, 315]
[views.side]
tidy = false
pitch_deg = 0
dirs_deg = [0, 180]
[views.front]
tidy = false
pitch_deg = 12
dirs_deg = [270, 90]

# Materialien: [Schatten, Mitte, Licht] als Stufen 0..5
# Schwarze Teile leben in 0..3 (3 nur als Lichtkante), Stahl und Silber in 3..5, das OLED-Gesicht in 5.
[materials]
track = [1, 2, 3]
sprocket = [1, 2, 3]
plastic = [1, 1, 2]
pcb = [1, 2, 2]
part = [1, 2, 2]
screw = [2, 3, 4]
cap = [2, 3, 4]
usb = [3, 4, 4]
bolt = [3, 4, 5]
steel = [3, 4, 5]
screen = [0, 0, 0]
oled = [2, 3, 3]
sensor = [1, 2, 2]
lens = [3, 4, 4]
motor = [0, 1, 2]
slot = [0, 0, 0]

# Spielzeug-Modell: Grundformen mit den Massen aus dem STEP, plus Uebertreibung fuers Suesse
[toy]
head_scale = 1.0            # OLED-Kopf skalieren (1 = echt, 1.3 = Chibi)
head_lift_mm = 0.0          # Kopf anheben (der Hals wird laenger)
neck_inset_mm = 4.0         # Hals so viel schmaler als der Kopf (jede Seite)
track_band_mm = 4.5         # Kettenstaerke inkl. Stollen
rim_mm = 3.0                # Ritzel-Felge
hub_mm = 4.5                # Ritzel-Nabe (Radius)
spoke_mm = 3.5              # Speichenbreite
bolt_mm = 2.2               # silberner Achsbolzen (Radius)
slots = 10                  # Schlitzreihe im Schild
slot_w_mm = 4.0
slot_pitch_mm = 7.0
slot_y_mm = [7.0, 10.0]     # Hoehe der Schlitze (von, bis)
caps_xz_mm = [[-16.8, -27.3], [-19.3, -15.7]]   # Elkos auf der Platine (zwei von acht: genug fuer Charakter)

# Gewicht bei der Mehrheitswahl pro Pixel: kleine, wichtige Teile setzen sich gegen grosse Flaechen durch
[vote]
screen = 2.5
cap = 1.4
bolt = 1.6
lens = 1.6

# Verlauf ueber die Hoehe eines Materials (Stufe unten, Stufe oben), gerastert mit Bayer 4x4 wie im ganzen System (D3)
[dither]
steel = [3.0, 4.9]          # Schild: unten Stahl, oben fast weiss (gebuerstetes Blech, Licht von oben)

[tread]
pitch_px = 4                # Stollenabstand in Sprite-Pixeln (ab 3 px liest das Auge eine Laufrichtung, 2 px flimmert)
groove_px = 1               # davon Rille (eine Stufe dunkler)
step_px = 1                 # Vorschub pro Frame: 8 Frames x 1 px = 2 Stollen, nahtlos

[eyes]
show = true                 # false = OLED bleibt schwarz, wie der echte Zumo (Varianten Z8, Z9)
offset_x_frac = 0.0         # Augenmitte relativ zur Bildschirmmitte, Anteil der Bildschirmtiefe (+ = nach vorne)
spacing_frac = 0.42         # Augenabstand als Anteil der Bildschirmbreite
min_rows_tall = 5           # so viele Bildschirmzeilen braucht die hohe Augenform, sonst flach
min_gap_px = 2              # ausser Draufsicht: mindestens so viel Luft zwischen den Augen
look_px = 1                 # ausser Draufsicht: Augen so weit in Fahrtrichtung verschoben (schaut, wohin er faehrt)
style = "E5"                # Augenregel fuer 3/4, Seite, Front (Codes unten, Bogen: `eyes`); ueberschreibt die Werte hier
diag_forward_frac = 0.0     # schraeg zur Kamera: Augen so weit nach vorne (Anteil der Bildschirmtiefe), schaut wohin er faehrt
show_away = true            # Augen auch, wenn er vom Betrachter wegfaehrt (false = Hinterkopf, OLED bleibt schwarz)
away_sin = 0.3              # ab diesem sin(Richtung) gilt "weg" (0.3: 45, 90, 135 Grad; 0 und 180 = Seite bleiben)
away_views = ["tq"]         # nur hier gilt der Hinterkopf (Vadim 8.10.: Augen der Ansichten, die er gut fand, nicht aendern)
plane = false               # Augenpaar folgt der Bildschirmebene (Iso-Treppe) statt auf einer Zeile zu stehen
far_narrow_px = 0           # Schraeg zur Kamera: das ferne Auge (Fahrtseite) so viel schmaler (3/4-Gesicht)

# Augenregeln (Vadim 8.10.: in 3/4 vorne/hinten "nicht so suess", von hinten wirkt er "andersrum"). Codes stabil.
# Befund: das OLED steht physikalisch nach hinten (Pololu-Text ist von vorne kopfueber, Foto 0J12327), ein aufrechtes
# Gesicht von hinten liest sich als Front.
[eye_styles.E1]
label = "Stand 8.10."
[eye_styles.E2]
label = "Hinterkopf"
show_away = false
[eye_styles.E3]
label = "Hinterkopf + nach vorne"
show_away = false
diag_forward_frac = 0.2
[eye_styles.E4]
label = "E3 + 3/4-Gesicht"
show_away = false
diag_forward_frac = 0.2
far_narrow_px = 1
[eye_styles.E5]
label = "E3 + Bildschirmebene"
show_away = false
diag_forward_frac = 0.2
plane = true
[eye_styles.E6]
label = "E4 + Bildschirmebene"
show_away = false
diag_forward_frac = 0.2
far_narrow_px = 1
plane = true

# Gesichter: Stempel fuer das linke Auge (rechtes = gespiegelt), '#' = an. tall bei grossem, flat bei flachem Bildschirm.
[faces.neutral]
tall = ["##", "##", "##"]
flat = ["##", "##"]
[faces.blink]
tall = ["..", "..", "##"]
flat = ["..", "##"]
[faces.happy]
tall = [".#.", "#.#"]
flat = [".#.", "#.#"]
[faces.angry]
tall = ["#..", "##.", "###"]
flat = ["##.", "###"]
[faces.dizzy]
tall = ["#.#", ".#.", "#.#"]
flat = ["#.#", ".#."]
[faces.sleep]
tall = ["###"]
flat = ["###"]
[faces.love]
tall = ["#.#", "###", ".#."]
flat = ["###", ".#."]

# LEDs: Lage auf der Platine (x vorne, z rechts, mm), Reihenfolge = Zeichen in den Mustern unten
[leds]
pos_mm = [[34.0, -19.0], [34.0, -2.0], [34.0, 14.0], [-25.0, -14.0], [-25.0, 3.0], [-25.0, 19.0]]
height_mm = 26.6

# Animationen (12 fps, 8 Frames = 0.67 s Loop): tread = Kette links/rechts (1 vor, -1 zurueck, 0 steht),
# faces/leds/bob_px pro Frame (kuerzere Listen wiederholen sich). LED-Zeichen: r g b y m c w = Farbe, . = aus.
# bob_px: ganzer Sprite hoch (negativ) fuer Hopser; hoechstens margin_px - 1.
[anims.drive]               # vorwaerts: Ketten laufen, Ritzel drehen
frames = 8
tread = [1, 1]
faces = ["neutral"]
leds = ["mryb.g"]
bob_px = [0]
[anims.reverse]             # rueckwaerts, Warnblinker
frames = 8
tread = [-1, -1]
faces = ["neutral"]
leds = ["yyy...", "yyy...", "yyy...", "yyy...", "......", "......", "......", "......"]
bob_px = [0]
[anims.turn_left]           # auf der Stelle links drehen (Ketten gegenlaeufig)
frames = 8
tread = [-1, 1]
faces = ["neutral"]
leds = ["mryb.g"]
bob_px = [0]
[anims.turn_right]
frames = 8
tread = [1, -1]
faces = ["neutral"]
leds = ["mryb.g"]
bob_px = [0]
[anims.idle]                # steht, blinzelt, LEDs atmen
frames = 8
tread = [0, 0]
faces = ["neutral", "neutral", "neutral", "neutral", "neutral", "blink", "neutral", "neutral"]
leds = ["mryb.g", "mryb.g", "mry.bg", "mry.bg"]
bob_px = [0]
[anims.push]                # Sumo: volle Kraft, boeser Blick, rotes Blinken
frames = 8
tread = [1, 1]
faces = ["angry"]
leds = ["rrrrrr", "rrrrrr", "......", "......"]
bob_px = [0, 0, -1, 0]
[anims.win]                 # gewonnen: Freudensprung, Regenbogen-LEDs
frames = 8
tread = [0, 0]
faces = ["happy"]
leds = ["rygbcm", "ygbcmr", "gbcmry", "bcmryg", "cmrygb", "mrygbc", "rygbcm", "ygbcmr"]
bob_px = [0, -1, -2, -2, -1, 0, 0, 0]
[anims.ko]                  # rausgeschoben: Spiralaugen, rot blinkend
frames = 8
tread = [0, 0]
faces = ["dizzy"]
leds = ["r.r.r.", ".r.r.r"]
bob_px = [0]
[anims.sleep]               # Pause: Augen zu, langsames Atmen
frames = 8
tread = [0, 0]
faces = ["sleep"]
leds = ["......"]
bob_px = [0, 0, 0, 0, -1, -1, -1, -1]
[anims.love]                # Maker-Night-Herz
frames = 8
tread = [0, 0]
faces = ["love", "love", "love", "love", "love", "love", "blink", "love"]
leds = ["mmmmmm", "mmmmmm", "m.m.m.", ".m.m.m"]
bob_px = [0, 0, -1, -1, 0, 0, 0, 0]

[palettes.natural]          # Echtfarben: schwarzer Zumo, Stahl, weisses OLED
steps = ["#0B0A12", "#24233A", "#3F3F5E", "#6A6E92", "#AEB7D0", "#F3F6FF"]
accents = {r = "#FF3B4E", g = "#3DFF7A", b = "#3B9BFF", y = "#FFB31F", m = "#FF4FD8", c = "#3BF0FF", w = "#FFFFFF"}

[palettes.value]            # Wertraum fuer Figma (Spark Lens): exakte Stufen k/5, Farbe macht der Shader
steps = ["#000000", "#333333", "#666666", "#999999", "#CCCCCC", "#FFFFFF"]
accents = {r = "#FFFFFF", g = "#FFFFFF", b = "#FFFFFF", y = "#FFFFFF", m = "#FFFFFF", c = "#FFFFFF", w = "#FFFFFF"}

[export]
dir = "~/vault/Files/03 Work/Spark/Assets/Zumo Sprites"   # pro Variante ein Unterordner (Z4/ ...)
palettes = ["natural", "value", "P1"]   # Sprite-Sheets in diesen Paletten (Namen aus [palettes] oder P-Codes)
seq_palettes = ["natural"]              # zusaetzlich als PNG-Sequenzen (Resolve, After Effects; je Frame eine Datei)
gif_palette = "natural"                 # GIFs fuer Galerie, Slack, Telegram
scale = 4                   # Vergroesserung (nearest) der Sequenzen und @4x-Sheets: 4 px = Raster R3 bei 1080p
fps = 12

[sheet]
zoom = 6                    # Vergroesserung im Kontaktbogen (nearest)
palettes = ["natural", "P1", "P17"]
grounds = ["#2B2A36", "#E9E6F2"]   # mittlerer + heller Grund, um Kontur und Lesbarkeit zu pruefen
variant_views = [["tq", 270], ["tq", 315], ["tq", 45], ["top", 90], ["top", 22.5], ["side", 0], ["front", 270]]
variant_looks = [["natural", "#E9E6F2"], ["natural", "#2B2A36"], ["P1", "#0A0711"]]

# Varianten zum Vergleichen (uv run src/zumo_sprites.py variants): ueberschreiben Werte aus [render]/[toy]/[eyes].
# Codes sind stabil: nie umnummerieren, verworfene nie neu vergeben.
[variants.Z1]
label = "CAD 2 mm/px"
model = "cad"
[variants.Z2]
label = "Spielzeug 2 mm/px"
model = "toy"
[variants.Z3]
label = "Chibi 2 mm/px"
head_scale = 1.3
head_lift_mm = 3.0
[variants.Z4]
label = "Chibi 2.6 mm/px"
mm_per_px = 2.6
head_scale = 1.35
head_lift_mm = 3.0
[variants.Z5]
label = "Mini 3.2 mm/px"
mm_per_px = 3.2
head_scale = 1.4
head_lift_mm = 3.0
[variants.Z6]
label = "Gross 1.5 mm/px"
mm_per_px = 1.5
head_scale = 1.2
head_lift_mm = 2.0
[variants.Z7]
label = "Z4 + Sticker-Kontur"
mm_per_px = 2.6
head_scale = 1.35
head_lift_mm = 3.0
outline_value = 4

[variants.Z8]
label = "Z4 ohne Augen"
mm_per_px = 2.6
head_scale = 1.35
head_lift_mm = 3.0
show = false
[variants.Z9]
label = "Z7 ohne Augen"
mm_per_px = 2.6
head_scale = 1.35
head_lift_mm = 3.0
outline_value = 4
show = false

# Sumo-Demo (uv run src/zumo_sprites_demo.py): zwei Zumos im Ring, zeigt die Sprites in einer Challenge-Animation.
# Echte Pixel-Art (Vadim 7.10.: "zu fake"): flacher Ring ohne Lichtkegel/Verlauf, alles laeuft auf 12-fps-Ticks und in
# ganzen Pixeln, Werte linear zwischen Keys (gerundet), Funke handgepixelt. Zeiten in Ticks, Positionen = [x, y] des
# Drehpunkts relativ zur Ringmitte in logischen Pixeln.
# v3 (Vadim 8.10.): schneller, A schiebt B von der Seite raus, dicker weisser Rand auch an der Kante, Grund transparent
# (GIF/ProRes fuer Slides und Videos). Bewegung in Iso-Diagonalen: ein Schritt = 2 px x, 1 px y (Iso-Treppe 2:1).
[demo]
variant = "Z7"              # Sticker-Kontur: liest sich auf dunklen Maker-Night-Gruenden
palette = "P1"              # Lila gehoert der Maker Night
size_px = [480, 270]        # logisches Raster, x4 = 1920 x 1080 (R3)
px = 4
tick_fps = 12               # alles (Sprites, Positionen, Funke) wechselt nur auf Ticks; Video 24 fps haelt jeden Tick 2 Frames
video_fps = 24
gif_px = 4                  # GIF-Vergroesserung (4 = 1920 x 1080, passt 1:1 auf Slides und Videos)
preview_ground = 0          # Stufe des Grunds nur im MP4 (Vorschau); GIF und ProRes sind transparent
ring_center_px = [240, 140]
ring_rx_px = 92             # stilisiert (massstaeblich waeren 148 px: Ring 77 cm, dann sind die Zumos zu klein)
ring_ry_frac = 0.5          # Iso 2:1 (pitch 30)
ring_h_px = 8               # Plattformkante (Mini-Sumo: 5 cm hoch)
border_px = [8, 4]          # weisser Rand: seitlich, oben/unten (Iso: halb so hoch). Vadim 8.10.: "deutlich dicker"
ring_values = [1, 4, 5]     # Stufen: Ringflaeche, Plattformkante (hell wie der Rand, eine Stufe tiefer = Kante), Rand
ring_outline = 0            # 1-px-Kontur um den Ring (Stufe), damit er auf hellen und dunklen Gruenden steht
shadow_px = [16, 6]         # flacher Schatten unter jedem Zumo auf dem Ring (Radien), Stufe 0
ticks = 40
dir_a = 315                 # A faehrt schraeg nach vorne rechts ...
dir_b = 225                 # ... B faehrt schraeg nach vorne links: A trifft B an der Flanke
keys_a = [[0, -46, -35], [3, -46, -35], [7, -6, -15], [9, -6, -15], [15, 54, 15], [40, 54, 15]]
keys_b = [[0, 30, -7], [6, 20, -2], [9, 20, -2], [15, 80, 28], [17, 86, 31], [40, 86, 31]]
fall_b = [[0, 0], [15, 0], [16, 3], [17, 8], [18, 6], [19, 8], [40, 8]]   # ueber die Kante, kleiner Hopser
anims_a = [[0, "idle"], [3, "drive"], [7, "push"], [17, "win"]]
anims_b = [[0, "drive"], [6, "idle"], [7, "ko"]]
impact_tick = 7
shake_px = [[2, 1], [-1, 0]]  # Bildversatz ab dem Aufprall, ein Eintrag pro Tick
jitter = [7, 9]             # Gerangel von bis (Tick): beide zusammen, Tick fuer Tick 1 px hin und her
spark_y_px = -15            # Funke ueber dem Bodenpunkt (Hoehe der Schildkanten)
# Funke pro Tick ab dem Aufprall, '#' = Stufe 5
spark = [
  [".#.", "###", ".#."],
  ["....#....", "....#....", "....#....", "...###...", "#########", "...###...", "....#....", "....#....", "....#...."],
  ["#.....#", ".......", "...#...", "..###..", "...#...", ".......", "#.....#"],
  ["#...#", ".....", ".....", ".....", "#...#"],
]
