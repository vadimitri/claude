# Z5 Zoom + Endkarte (Vadim 2.10.: "Infinite Zoom und dann das Kick-off mit Ease-in/Ease-out, richtig schoen
# motion-maessig, in die Mitte, QR groesser in der Mitte"): 4 Takte T16, Karussell endet auf F1 auf dem Bass-Boom, der
# Zoom bremst ab (ease_out) und laeuft bis zum Schluss weiter, ab Takt 7 dimmt er im Korn ab und die Karte setzt ein:
# SPARK faellt von oben (Takt 7), KICK-OFF von links, Datum von rechts (je 1 Beat), IGORs Stopp = Stille, alles steht,
# auf dem Hit danach (20.59 s) springt der QR aus der Mitte auf, JOIN US + Info folgen. Schluss Takt 10 (26.47 s).

[ending]
carousel_bars = 4
runout_bars = 0
length_bars = 9.0          # bis Takt 10: der QR steht ~6 s (scannen)
card_on = true
# Einsatz je Teil: [Teil, Beat ab Karussell-Ende, Start-Versatz x (Bruchteil Bildbreite), y (Bildhoehe), Startmassstab].
# Jeder Teil landet in card_in_beats mit Ease-out-back (schiesst ueber, setzt sich) und blendet im Korn ein.
card_moves = [["title", 8.0, 0.0, -0.12, 1.0],     # Takt 7: SPARK faellt von oben
              ["what", 9.0, -0.6, 0.0, 1.0],       # KICK-OFF von links
              ["when", 10.0, 0.6, 0.0, 1.0],       # Datum von rechts; Beat 11 = IGORs Stopp, Stille, alles steht
              ["qr", 12.0, 0.0, 0.0, 0.0],         # Hit nach dem Stopp: QR springt aus der Mitte auf
              ["cta", 12.5, 0.0, 0.03, 1.0],       # JOIN US
              ["info", 13.0, 0.0, 0.03, 1.0]]
card_in_beats = 0.5        # Dauer eines Einsatzes
card_overshoot = 1.70158   # Ease-out-back: 1.70158 = 10 % ueber das Ziel, 0 = reines Ease-out (kubisch)
card_dim_frac = 0.85       # Zoom dimmt ab dem ersten Einsatz in 1 Einsatzdauer auf so viel Grund (im Korn): Karte lesbar
card_title_w_frac = 0.74   # SPARK so breit (Bruchteil der Bildbreite). 9:16-Sicherheitszone: Inhalt 14-76 % der Hoehe
card_top_frac = 0.14       # Oberkante SPARK (Bruchteil der Bildhoehe)
card_sub_frac = 0.40       # KICK-OFF und Datum: Versalhoehe relativ zu SPARK
card_gap_frac = 0.30       # Abstand zwischen den Zeilen (relativ zu SPARK)
card_qr_module_cells = 4   # QR gross: 1 Modul = 4 Zellen (Plakat: 2), 29 Module → 116 Zellen = 43 % der Bildbreite
card_qr_quiet_cells = 4    # Ruhezone um die Module (Zellen)
card_qr_y_frac = 0.58      # Mitte des QR (Bruchteil der Bildhoehe)
card_glow_cells = 16       # Gluehen um die Platte (Zellen)
card_cta_cells = 12        # JOIN US Versalhoehe (Zellen)
card_cta_gap_cells = 8     # JOIN US ueber der Platte (Zellen)
card_info = ["ORT FOLGT"]  # PLATZHALTER unter dem QR (Ort steht noch nicht fest; kickoff.COPY["where"] geht vor)
card_info_frac = 0.30      # Versalhoehe der Info relativ zu SPARK

[endcard]
end_mode = "zoom"
end_frame = 1
zoom_center = [0.50, 0.50]
core_shrink = 1.0
type_out_beats = 1.0
fade_beats = 0.0           # kein Schwarz: die Karte steht bis zum Schluss
info_cap_cells = 20
info_lead_frac = 1.3
info_y_frac = 0.50
info_in_beats = 0.5
burst_on = false
impact_on = false
zoom_dolls = 9.0
zoom_ease = "ease_out"     # schnell rein (wie die Kamera vorher), bremst unter der Karte fast auf Stillstand
zoom_ease_pow = 2.0
zoom_spin_deg_per_s = 20
info = []
info_at_beats = 0.0
