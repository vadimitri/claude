# F12 = F11b (Schrift als Fenster, Vadim 8.10.) + Geburt aus dem schwarzen Spark + neue Enden F12a-g, Foto-Phase MC3.
# Je Variante F12x/F12x.toml: [f12] end + Abweichungen. Bis zur Geburt laeuft das MC3-Video (Satz/Licht/Welle aus base_toml).
[f12]
base_toml = "kickoff_loop/previz/review/MC3/MC3.toml"
base_video = "Vorschau/MC3_draft.mp4"         # im Hauptcheckout (gitignored)
song = "kickoff_loop/resolve/schnitt/M4a.wav"  # im Hauptcheckout (gitignored), beginnt auf Timeline-Bild 0
song_start_s = 18.143417                       # Songzeit auf Timeline-Bild 0 (songcut.toml, Vadims Compound)
grid = "kickoff_loop/ref/audio/igor_beats.json"
# Beats ab Taktstrich 1 der Timeline (4.292 s, 81.6 BPM = 0.735 s): 4 = Eins Takt 2 (7.23 s), 8 = Eins Takt 3 (10.17 s)
birth_beat = 4                                 # neuer Spark waechst im dunklen (7.23 s) ...
words_beat = 5                                 # ... deckt das Bild, auf dem Beat steht die Maske (7.97 s)
card_beat = 8
stop_beat = 11                                 # Stopp 12.38 s: Licht aus, Schrift steht in der Stille
end_s = 13.042                                 # 313 Bilder, M4a endet 13.03 s im Stopp
words = ["HARDWARE", "ROBOTS", "HACKATHONS"]   # PLATZHALTER, je Beat einer (Vadim tauscht); einer weniger als F11b (Geburt)
birth_xy = [0.62, 0.47]                        # Startpunkt im dunklen Spark (Bildanteile; load prueft, dass er drin liegt)
birth_r0 = 0.03                                # Spitzenradius am Start (Anteil Bildbreite), waechst mit konstanter Zoomrate
world_start = 0                                # erstes Plakat im Fenster, dann eins je world_step_frames Bilder (Zweier)
world_step_frames = 2
window_gap_cells = 14                          # Abstand unter SPARK
window_margin_cells = 19                       # unterer Rand (wie die Satzkante)
window_lead_frac = 1.06                        # Zeilenabstand / Versalhoehe
kick_glow = 3.0                                # Zuendung: Lichtschweif x3 ueber F10 ...
kick_decay_beats = 0.35                        # ... klingt so schnell ab (exponentiell)
kick_wave_beats = 1.0                          # Welle bringt SPARK weiss + Datum in 1 Beat (F11b: 2) ...
kick_wave_pow = 0.55                           # ... schnell aus dem Spark, bremst (F11b: 1 = gleichmaessig)
collapse_beats = 0.5                           # Sog/Implosion/Schwarzer Spark: so lange vor der Eins von Takt 3 ...
collapse_pow = 2.0                             # ... zieht an (log-Radius ~ u^2) ...
collapse_r_end = 0.01                          # ... bis auf diesen Rest (Anteil Bildbreite bzw. Zoom)
