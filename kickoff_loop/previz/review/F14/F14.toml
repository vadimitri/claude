# F14 = Vadim 8.10. zu F13: Maske = der Spark des Plakats darunter (echte Bahn F21 → F1, Silhouette des Stils je Bild,
# posterisierter Rand), loest sich erst zum Ueberdecken; Woerter bleiben stehen, ein Spark-Loch zieht wie ein Vorhang auf
# der Loop-Bahn weg; Halo je Zeile waechst statt abzuklingen; nach der dritten Stufe laenger stehen.
[f14]
base_toml = "kickoff_loop/previz/review/MC3/MC3.toml"
base_video = "Vorschau/MC3_draft.mp4"         # im Hauptcheckout (gitignored)
song = "kickoff_loop/resolve/schnitt/M4a.wav"  # im Hauptcheckout (gitignored), beginnt auf Timeline-Bild 0, endet 13.03 s
song_start_s = 18.143417
grid = "kickoff_loop/ref/audio/igor_beats.json"
end_s = 14.0                                   # 336 Bilder; hinter dem Song Stille (song_pad.wav im Ordner)
# Beats ab Taktstrich 1 der Timeline (4.292 s, Beat 0.7352 s)
birth_beat = 4                 # Maske = Plakat-Spark auf der Bahn, im Karussell-Tempo, kommt bei F21 aus der Tiefe ...
birth_grow_frames = 3          # ... waechst in so vielen Bildern aus dem Punkt auf seine Bahngroesse ...
cover_frames = 4               # ... und loest sich in den letzten Bildern vor words_beat vom Plakat, waechst bis er deckt
words_beat = 5                 # erste Wand (7.97 s), Spark steht auf F1 und deckt
words = ["HARDWARE", "ROBOTS", "HACKATHONS"]   # PLATZHALTER, je Beat eine Wand
pull_beat = 8                  # Vorhang: Spark-Loch zieht ab hier auf der Bahn weg, bis zur ersten Stufe ist es zu ...
pull_frames = 16               # ... und laeuft dabei so viele Bahnframes weiter (F1 → F17 = hinten, hinter dem Titel) ...
pull_pow = 2.0                 # ... zieht an (u^2: erst fehlt kaum etwas) ...
pull_vanish_frac = 0.3         # ... und verschwindet im letzten Teil in der Tiefe
pull_release_frac = 0.7        # Loch schrumpft im ersten Teil von Deckgroesse auf den Plakat-Spark
sil_reach = 1.3                # Silhouette: Auslaeufer des Stils (Spritzer, Scherben, Schein) zaehlen bis so viel x Spitzenradius
sil_rim = 0.12                 # posterisierter Rand: Bayer-Band ausserhalb des Koerpers, Anteil am Spitzenradius
steps = [8.5, 9.5, 10.25]      # Tonleiter: gemessene Bass-Einsaetze C2 / D2 / D#2 in M4a (Stille ab ~10.8)
step_items = [2, 3, 4]         # sichtbare Kartenteile je Stufe: 1 SPARK, 2 + KICK-OFF, 3 + Datum, 4 + Ort
glow_start_frac = 0.2          # Halo einer neuen Zeile startet bei so viel seiner Laenge ...
glow_grow_beats = 0.75         # ... und waechst so lange (ease-out); aeltere Zeilen bleiben, wie sie sind
fade_hold_beats = 1.5          # nach der letzten Stufe so lange stehen (F13 0.15), dann ...
fade_beats = 0.45              # ... schrumpft + dunkelt alles Licht und nimmt die Schrift mit (schwarz ~13.3 s)
wall_margin_cells = 19         # Rand oben/unten der Wortwand
wall_lead_frac = 1.06          # Zeilenabstand / Versalhoehe
