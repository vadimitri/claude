# F11 = gemeinsame Stellschrauben der Ideen F11a-g (Vadim 8.10. zu F10 + M4a: "super antiklimatisch, auf den Beat,
# subtil oder Schnitte, Begriffe als Platzhalter, dann das Ende"). Je Idee F11x/F11x.toml: [f11] idea + Abweichungen.
# Bis zur Eins von Takt 2 laeuft F10a, Satz/Licht/Farben/Welle kommen aus base_toml ([ending] orbit_*).
[f11]
base_toml = "kickoff_loop/previz/review/F10a/F10a.toml"
base_video = "Vorschau/F10a_draft.mp4"        # im Hauptcheckout (gitignored)
song = "kickoff_loop/resolve/schnitt/M4a.wav"  # im Hauptcheckout (gitignored), beginnt auf Timeline-Bild 0
song_start_s = 18.143417                       # Songzeit auf Timeline-Bild 0 (songcut.toml, Vadims Compound)
grid = "kickoff_loop/ref/audio/igor_beats.json"
# Beats ab Taktstrich 1 der Timeline (4.292 s, 81.6 BPM = 0.735 s): 4 = Eins Takt 2 (7.23 s), 8 = Eins Takt 3
# (10.17 s), 11 = Stopp (12.38 s, 1 Beat Stille), 12 = Hit (13.12 s, nicht mehr in M4a)
words_beat = 4
card_beat = 8
stop_beat = 11
end_s = 13.042                                 # 313 Bilder, M4a endet 13.03 s im Stopp
stop = "light_off"                             # freeze = Bild steht | light_off = Licht aus, Schrift bleibt | black | hit
words = ["HARDWARE", "ROBOTS", "HACKATHONS", "PROTOTYPES"]   # PLATZHALTER, je Beat einer (Vadim tauscht)
word_y = 0.43                                  # Mitte der Begriffe (Bildhoehe), ueber dem Spark (0.5)
word_scale_max = 4.0                           # Begriffe gleich gross, der laengste fuellt die Satzbreite (Deckel x Datum)
ramps = [   # Licht/Duoton je Begriff, dunkel → hell; der erste = F10-Blau (orbit_pre_colors), kein Lila
  ["#000000", "#020A2E", "#0A1F8F", "#1E5BFF", "#6FC8FF", "#E6F7FF"],
  ["#000000", "#00161A", "#005F6B", "#00C2D1", "#7FF5FF", "#F0FFFF"],
  ["#000000", "#0E1A00", "#3D6B00", "#9BE000", "#E6FF5C", "#FBFFE8"],
  ["#000000", "#2A0016", "#8A0A4A", "#FF2E88", "#FF9FCB", "#FFF0F7"],
]
