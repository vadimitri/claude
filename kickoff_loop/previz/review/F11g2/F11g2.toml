# F11g2 = F11e mit Songschnitt M4d (M4a bis zur B-Eins): im Stopp Standbild in 2 Stufen in die Stille, auf dem Hit
# (13.12 s, staerkster Anschlag im Song) die rote Endkarte mit vollem Licht, klingt einen Takt aus, Schluss auf der B-Eins.
[f11]
idea = "pulse"
stop = "hit"
song = "kickoff_loop/resolve/schnitt/M4d.wav"
end_s = 16.04                 # B-Eins 16.056 s (Beat 16), letztes ganzes Bild davor
hit_beat = 12
hit_glow_scale = 2.4          # Licht auf dem Hit (F10: 1.6)
hit_decay_beats = 1.6         # exponentiell
pulse_wave_pow = 0.55        # schnell aus dem Spark, dann bremsend (Ripple-GIF)
pulse_wave_beats = 1.0
wave_lead_16ths = 0.3
[f11.cut]                     # songcut.py wie M4a (Naht 5.89 s, 4 Takte raus), Quelle bis zur B-Eins (Songzeit 45.963 s)
at_s = 5.89
bars = 4
length_s = 27.8194
fade_ms = 15
