# O9 = O8 + Vadims Urteil 2.10. (Uebergabe O9): JOIN US geht mit dem QR, Begriffe pro Beat kristallisieren an der
# QR-Stelle, Zoom durch alle Sparks (Matrjoschka aus verschiedenen Sternen, Rate gedeckelt), Gluehen bleibt, KICK-OFF/Datum
# kippen je Zeile. Video 6 Takte (17.6 s) statt 5, damit 10 Begriffe + Schluss passen.
# O8 = Vadims O7/test.toml + Finale (Vadim 2.10.: "Matrjoschka soll sich nicht drehen, langsamer werden, gerade bleiben";
# kein neuer Titel, kein QR auf einer Karte, kein laufender Verlauf ("nur Linien, die sich hochziehen"); Titel + Untertitel
# bleiben und gluehen, damit man sieht, wie stark wir reinzoomen; nur der QR loest sich nach vorn in Pixel auf, dann
# NEW SEMESTER, NEW PROJECTS; das Abdimmen in den Grund schliesst das Video ab). Zeiten in Beats ab dem Karussell-Ende.

[ending]
carousel_bars = 2
runout_bars = 0
runout_hold_beats = 0.0
length_bars = 6.0          # 17.6 s (O8: 5 = 14.7 s; fuer 8 Begriffe je 1 Beat + NEW SEMESTER)
card_on = false            # keine Endkarte: der Plakatsatz bleibt
orbit_path = "dive"
orbit_frame = 1
orbit_loops = 1.0
orbit_loop_speedup = 1.6
orbit_dive_lead_frames = 7
orbit_dive_core_shrink = 20.0
orbit_throw_speedup = 8.0
orbit_dive_drift_pow = 0.5
orbit_dive_target = [0.5, 0.5]    # Vadims test.toml: mittig
orbit_dive_shutter_frac = 0.0     # O9: Sterne wechseln, keine Ringe, die flackern (Zoomrate gedeckelt)
orbit_spin_speedup = 1            # ohne Finale: Drehung legt nicht zu
orbit_cycle_beats = 1.73         # Farbe steht ab hier (Endfarbe), die Sterne wechseln in der Matrjoschka
orbit_type_morph = false          # kein Morph in eine Karte
orbit_type_out_at_beats = 99.0    # Satz zerfaellt nie (steht bis zum Schluss)
orbit_type_out_beats = 1.0
orbit_flow_at_beats = 1.0
orbit_flow_in_beats = 1.0
orbit_flow_steps = 1.0
orbit_flow_per_beat = 0.0         # Verlauf laeuft nicht (Vadim: "funktioniert nicht, nur Linien von unten nach oben")
# Finale
orbit_zoom_max_per_frame = 1.5    # O9: Zoom hoechstens x1.5 pro Bild (O8 lief bis x2e7 pro Bild = "direkt unscharf"). Am
                                  # Wechsel zoomt die Bahn schon x1.26/Bild, der Bildfluss braucht x1.43, sonst "Zoom langsamer"
orbit_zoom_peak_beats = 4.0       # Zoom haelt das Tempo bis hier (Momentum) ...
orbit_zoom_decay = 0.75           # ... danach Rate x0.75 pro Beat: wird langsamer, waehrend die Sterne wechseln
orbit_sparks = ["S48d", "S23", "S54c", "S47", "S50", "S14", "S24", "S31", "S19d", "S31e", "S18d", "S31g", "S58b",
                "S48e", "S26", "S60d", "S59b", "S56", "S57b"]   # Puppen nach S33: alle Sterne aus [styles].cycle, je einmal
orbit_sparks_ratio = 0.26         # naechste Puppe so gross (= Kern der S33: 0.64^3, dort setzt Puppe 1 ein)
orbit_spin_stop_beats = 2.0       # Drehung laeuft ab dem Wurf in ~2 Beats linear aus (stetig) ...
orbit_spin_rest_deg = 0.0         # ... und steht gerade (0 Grad + Vielfache von 60)
orbit_glow_frames = 2.0           # Zoom-Gluehen: Schweif = Zoom in 2 Bildern (O9: haelt den Hoechstwert bis zum Abschluss) ...
orbit_glow_max_scale = 1.6        # ... hoechstens x1.6 um die Zoom-Mitte (sonst fuellt der Schweif die Seite)
orbit_dissolve = ["qr", "cta"]    # O9: JOIN US geht mit dem QR (Vadim 2.10.)
orbit_dissolve_at_beats = 3.0     # QR zerfaellt ab hier (Stern steht schon gerade) ...
orbit_dissolve_beats = 1.5        # ... in so vielen Beats ...
orbit_dissolve_scale = 6.0        # ... die naechsten Splitter wachsen bis x6 (fliegen auf die Kamera)
# Begriffe an der QR-Stelle (Vadim 2.10.: "Robotics, Drones, Autonomous Robots, Robotfights, Sensorik, Elektronik und so
# weiter"; 3D PRINTING, SOLDERING = Vorschlag aus den Spark-Workshops, weitere: PCB DESIGN, FIRMWARE). Je Begriff eine
# Liste Zeilen, der letzte bleibt stehen. 8 Begriffe passen in 6 Takte (Beat 5-12), NEW SEMESTER ab Beat 13.
orbit_words = [["ROBOTICS"], ["DRONES"], ["AUTONOMOUS", "ROBOTS"], ["ROBOT FIGHTS"], ["SENSORS"], ["ELECTRONICS"],
               ["3D PRINTING"], ["SOLDERING"], ["NEW SEMESTER,", "NEW PROJECTS"]]
orbit_words_at_beats = 5.0        # erster Begriff auf dem Beat nach dem QR-Zerfall (3 + 1.5) ...
orbit_words_beats = 1.0           # ... je Beat einer, ersetzt den vorigen
orbit_words_grow_beats = 0.33     # Kristall waechst in 1/3 Beat (8 Bilder), als Difference wie SPARK ...
orbit_words_fade_beats = 0.25     # ... dann 1/4 Beat Fade in die Tintenstufe
orbit_close_at_beats = 13.5       # Abschluss: Zoom kippt im Korn in den Grund, waehrend NEW SEMESTER einsetzt ...
orbit_close_beats = 1.0           # ... in 1 Beat, dann steht der Satz allein (1.5 Beats bis Beat 16)

[endcard]
end_mode = "orbit"
burst_on = false
impact_on = false
