# I7 Fluss grob: 8 Stufen, 8 x 8-Zellen-Quadrate, 4 Wellen (verschlungener). Nur [ground].
[ground]
mode = "flow"        # linear | islands | flow (styles.ground_shape)
angle_deg = 110      # Richtung des Verlaufs (0 = links→rechts, 90 = oben→unten), dunkel → hell
waves = 4
wave_freq = [0.35, 1.0]   # Perioden pro kurzer Plakatseite, zufaellig dazwischen (klein = grosse Schwuenge)
warp_frac = 0.35     # wie weit die Wellen schieben (kurze Seite; Befund 3.10.: 0.18 gab fast parallele Streifen)
flow_per_loop = 1    # jede Welle laeuft so viele Perioden pro Umlauf weiter (ganzzahlig = nahtlos, 0 = steht)
terraces = 8
blocks_cells = 8
gain = 2.2           # Hoehe: 2 = gut eine Palettenstufe ueber dem Grund (bleibt in der ersten Colorway)
lin_frac = 0.0
seed = 5
