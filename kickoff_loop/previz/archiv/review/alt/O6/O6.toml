# O6 = O4 neu, Wurf in die Tiefe (Vadim 3.10. zu O4: "stoppt kurz, bewegt sich und dann nach hinten weiter, keine
# fluessige Linie"; Befund 1.10.: das Bildtempo fiel nach dem Wurf 46 -> 3 px/Bild). Ein digitaler Umlauf ab dem
# Bass-Boom, auf F14 laesst er los und fliegt auf gerader Linie zum Fluchtpunkt seiner Richtung (rechts von SPARK),
# perspektivisch exakt: Bildtempo und Schrumpfen werden nur schneller, bis er dort verschwindet ("zack").
# Musik-Sync zweitrangig (Vadim schneidet am Ende). Nur geaenderte Abschnitte, Rest aus loop.toml.

[ending]
carousel_bars = 2          # Kamerafahrt + Karussell T16 (Vadim 1.10.: "den Anfang schaut sich kein Mensch so oft an", war 4)
runout_bars = 0
runout_hold_beats = 0.0
length_bars = 5.0          # ganzes Video in Takten ab Anfang (14.7 s, war 7.75-7.9 = 22.8 s): QR steht ~6 s
card_on = true
# Bahn-Ende (end_mode = "orbit"). Zeiten in Beats ab dem Karussell-Ende (= Bass-Boom); end_frame folgt daraus
orbit_path = "throw"       # gerade Linie in die Tiefe, gesteuert ueber 1/Z (Radius und Abstand zum Fluchtpunkt)
orbit_frame = 14           # loslassen auf F14 (noch auf dem Weg nach hinten): Tangente rechts in die Tiefe
orbit_loops = 1.0          # Vadim 3.10.: ab dem Moment, wo es digital ist, EIN Umlauf (1.96 s), dann die neue Bahn
                           # (v1 hatte 1.1-2.6 Umlaeufe: "zu teasing"). Karussell-Endframe und Zeitpunkt folgen daraus
orbit_loop_speedup = 1.6   # Vadim 1.10.: "den letzten Loop auch noch schneller": Tempo x1.6 pro Beat ab T16 (1 = gleichmaessig)
orbit_throw_speedup = 8.0  # Bildtempo x8 pro Beat ab dem Tempo der Bahn (war 5, Vadim 1.10.: "Wegschleudern zu langsam")
orbit_spin_speedup = 5.0   # Drehung: Bahntempo, legt pro Beat das 4-fache zu
orbit_cycle_beats = 1.73   # Farben/Sterne wechseln bis zum Wurf (Beat 1.73 bei x1.6), dann steht die Colorway
orbit_type_morph = true    # Satz zerfaellt je Element, waehrend sein Gegenstueck auf der Karte eindithert (false = alter Zerfall)
orbit_type_out_at_beats = 3.0      # nur ohne morph: Titelblock zerfaellt im Korn ab hier ...
orbit_type_out_beats = 1.0         # ... in so vielen Beats (weg, wenn SPARK der Karte faellt)
orbit_flow_at_beats = 1.0  # Verlauf in der Schrift faengt an zu laufen (Beats nach dem Karussell-Ende) ...
orbit_flow_in_beats = 1.0  # ... waechst in so vielen Beats auf ...
orbit_flow_steps = 2.0     # ... so viele Palettenstufen Spannweite (Plakat: text_gradient_steps 1; 3 halbierte kleine Schrift, Lesbarkeit 0.85) ...
orbit_flow_per_beat = 1.0  # ... und laeuft so viele Zeilenhoehen pro Beat nach oben (0 = steht). Posterisiert
card_reveal = "bayer"
card_diff = false
card_moves = [["title", 2.75, 0.0, 0.0, 1.0],     # [Teil, Einsatz in Beats, dx, dy, Startmassstab]. Vadim 1.10.: nichts
              ["what", 3.0, 0.0, 0.0, 1.0],       # poppt von links/rechts ein ("dieses Jumping sieht scheisse aus"):
              ["when", 3.25, 0.0, 0.0, 1.0],      # dx = dy = 0, Massstab 1, nur Eindithern (card_reveal). Mit
              ["qr", 3.5, 0.0, 0.0, 1.0],         # orbit_type_morph loest sich das Plakat-Gegenstueck gleichzeitig auf
              ["cta", 3.5, 0.0, 0.0, 1.0],
              ["info", 3.75, 0.0, 0.0, 1.0]]
card_in_beats = 1.0        # Eindithern dauert die Haelfte davon (0.5 Beat), Zerfall des Gegenstuecks gleich schnell
card_overshoot = 1.70158
card_dim_frac = 0.0        # nichts abzudimmen: der Stern ist weg, die Karte steht auf dem Grund der Colorway
card_title_w_frac = 0.74
card_top_frac = 0.14
card_sub_frac = 0.40
card_gap_frac = 0.30
card_qr_module_cells = 4
card_qr_quiet_cells = 4
card_qr_y_frac = 0.58
card_glow_cells = 16
card_cta_cells = 12
card_cta_gap_cells = 8
card_info = ["ORT FOLGT"]
card_info_frac = 0.30

[endcard]
end_mode = "orbit"
burst_on = false
impact_on = false
