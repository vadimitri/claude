# SPARK Kick-off Loop · alle Stellschrauben an einem Ort. Begriffe: kickoff_loop/CLAUDE.md, Abschnitt "Begriffe".
# Der Code (src/kickoff_loop*.py) enthaelt keine Gestaltungswerte, nur Logik. Was hier fehlt, ist Systemkonstante
# und steht in src/styles.py (Paletten, Dither, Pixelraster) oder src/kickoff.py (Satz: Raender, Schriftgroessen).
#
# Einheiten stehen im Namen: _s Sekunden · _deg Grad · _frac Bruchteil 0..1 · _px Pixel · _cells Zellen des Pixelrasters
# (1 Zelle = 1 "8-Bit-Pixel", auf dem A3-Druck 12 px = 1 mm, in der Vorschau 4 px).
# Plakatgeometrie: x/y = Bruchteil von Plakatbreite/-hoehe, Groessen = Bruchteil der kurzen Plakatseite.
# Nach jeder Aenderung:  uv run src/kickoff_loop.py preview   → kickoff_loop/previz/vNNN/ (alte Versionen bleiben liegen)

[loop]
bpm = 120            # Tempo der Musik (4/4). 1 Takt = 2 s, ein Frame pro 16tel = 8 Frames pro Sekunde.
frames = 32          # Frames im Loop = Plakate. 32 in 16teln = genau 2 Takte = 4 s pro Umlauf.
key_every = 2        # jedes 2. Frame ist ein Aushang (Nummern 1, 3, 5 …: haengt auf dem Campus, muss allein tragen).
                     # Die anderen sind Zwischenframes: nur fuers Video gedruckt, einmal aufgehaengt, fotografiert.

[color]
# Farbreise: Colorway-Stationen, gleichmaessig verteilt (bei 32 Frames und 8 Stationen auf Frame 1, 5, 9 … 29,
# alles Aushaenge). Dazwischen werden die Nachbarn Stufe fuer Stufe in OKLab gemischt: zwei benachbarte Frames
# unterscheiden sich nur wenig, ueber den Loop wandert die Farbe einmal im Kreis und kommt wieder an.
# Reihenfolge geprueft (30.9.): keine Mischung wird lila/fliederfarben (Rot direkt neben Blau wuerde es, z. B. P18 → P17).
# Nur dunkle Gruende: eine Papier-Colorway (P16 P21–P24) mittendrin wuerde auf dem Weg grau.
stations = ["P11", "P13", "P10", "P19", "P18", "P14", "P20", "P15"]
steps = 6            # Palettenstufen nach dem Angleichen; 4-stufige Paletten (P6 P9 P26) werden gedoppelt, nicht gemischt

[styles]
# Stern-Stile (Codes wie in styles/index.html), jeder haelt hold_frames Frames, dann der naechste; die Liste laeuft reihum.
# hold_frames = 2: Aushang und folgender Zwischenframe teilen sich den Stil, der Stil springt mit 4 statt 8 fps.
# Nur Stile mit stabiler Silhouette: S2 S7 S33 S19d S23 S26 S36. S14 S24 S40 S31–S31d brechen sie, S13 streut
# Kindsterne ueber den Titel (v003-Test: Lesbarkeit 0.85). 7 Stile teilen 32 nicht: die zweite Runde mischt anders.
cycle = ["S7", "S2", "S19d", "S33", "S23", "S26"]   # S36 raus (Vadim 30.9.: "schmilzt, sieht scheisse aus")
hold_frames = 2
seed = 3             # Korn der rauschbasierten Sterne. Gleich auf allen Plakaten.

[spark]
# Bumerang: der Stern kreist einmal um den Betrachter. Frame 1: er kommt hinten links (am linken Ohr vorbei) ins Bild,
# fliegt in die Tiefe (wird klein), kehrt um, kommt auf einen zu (wird gross) und verlaesst das Bild rechts.
# Zwischen dem letzten und dem ersten Frame fliegt er hinter dem Betrachter herum (unsichtbar): der Sprung von rechts
# nach links IST der Neustart des Karussells. Gerechnet als Kreisbahn im Raum mit Zentralprojektion.
# v004 (Vadim 30.9.: "richtiger Bumerang, man soll die Rotation sehen, dreidimensionaler", "kleinere Sparks"):
# fern jetzt Radius 0.20 statt 0.54 (die kleinen Frames sind Fotoframes: gedruckt fuers Video, nicht zum Aushaengen),
# und der Stern ist eine flache Scheibe, die sich im Flug ueberschlaegt (styles.tilt).
vanish = [0.50, 0.50]      # Fluchtpunkt (x, y) auf dem Plakat: dort verschwaende der Stern im Unendlichen
height = 0.22              # Bahn liegt so weit unter Augenhoehe (Einheit: Bahnradius): nah = tiefer im Bild
near = 0.0                 # Abstand Bahnmitte → Betrachter (Bahnradius = 1). Kleiner = er kommt naeher ran
depth = 1.0                # Tiefe der Bahn (Ellipse), groesser = fliegt weiter weg
lens = 0.15                # Brennweite (kurze Plakatseite pro Einheit Abstand)
size = 1.35                # Sterngroesse in Bahneinheiten. Ergebnis: Radius 0.20 (fern) bis 0.92 (nah)
sweep_deg = [-78, 73]      # sichtbarer Bogen (0 = geradeaus, fern). Der Rest passiert hinter dem Kopf
far_rush_frac = 0.7        # fern schneller, nah verweilen: 0 = gleichmaessig, 0.7 = nah halbes Tempo, fern 1.7-fach
rot_start_deg = 0          # Drehung im ersten Frame
spin_deg = 600             # Eigendrehung pro Umlauf (18.75° pro Frame: unter 30°, sonst liest das Auge die 6-zackige
                           # Form rueckwaerts drehend). Vielfache von 60° schliessen nahtlos
tumble_turns = 1           # Ueberschlaege der Scheibe pro Umlauf: 1 = einmal ganz herum (Vorderseite → hochkant →
                           # Rueckseite → hochkant → Vorderseite), hochkant bei 1/4 und 3/4 des Loops
tumble_start_deg = 0       # 0 = Frame 1 frontal
thin_min_frac = 0.12       # hochkant nie duenner als dieser Bruchteil (ganz hochkant waere eine Linie)
axis_start_deg = -35       # Kippachse am Anfang (0 = waagerecht, Stern klappt nach oben/unten)
axis_turn_deg = 180        # so weit dreht die Achse ueber den Loop: der Stern geht schraeg weg und kommt hochkant
                           # zurueck. Vielfache von 180° schliessen nahtlos

[type]
# Verlauf in den Buchstaben, pro Zeile von der Grundlinie (dunkler) bis zur Versalhoehe (hellste Stufe), in Palettenstufen.
text_gradient_steps = 1.0
# Keine Kopfzeile (Vadim 30.9.: Nummern komplett raus). SPARK steht waagerecht zentriert und waechst um seine Mitte.
# Titelblock (SPARK, KICK-OFF, Datum) waechst von Frame 1 bis Frame N linear auf 1.0 = Standardsatz, dann Sprung zurueck.
# Das Karussell endet immer auf Frame N: der Titel steht vor dem Digitalteil genau im Standardsatz.
title_scale_start = 0.86

[qr]
# JOIN US und QR stehen, wie sie sind: dunkelste Stufe auf der hellsten, 3 Module Ruhezone, JOIN US mittig darueber.
# Keine Karte: ihr heller Grund laeuft weich ins Plakat aus, abgerundet (keine Kante, keine Ecke), in eigenem Dither.
label_pad_cells = 3        # Luft um JOIN US (oben bis zum Auslauf, unten bis zur QR-Platte)
halo_fade_cells = 12       # Laenge des Auslaufs (Gauss). Groesser = weicher, unsichtbarere Grenze, aber mehr Licht
halo_round_frac = 0.45     # Eckradius des hellen Kerns (Bruchteil der halben kurzen Seite). Aussen wird es immer runder
halo_warp_cells = 3        # leichte Unregelmaessigkeit des Auslaufs (festes Rauschen), 0 = exakt rund
halo_dither = "blue"       # blue = Blue Noise (organisch) | bayer4 = wie der Rest des Plakats

[video]
size_px = [1080, 1920]     # Ausgabe Breite x Hoehe (9:16 fuer Reel/Story)
timeline_fps = 24          # Resolve-Timeline
start_poster_frac = 0.38   # Plakathoehe / Bildhoehe am Anfang: Umgebung (Campus) gut sichtbar
surround_luma = 0.22       # Grading: Umgebung jedes Fotos auf diese mittlere Helligkeit (0..1) ziehen. Sonst blitzt bei
                           # 8 fps jeder Ortswechsel ueber das ganze Bild. Dunkler = Plakat leuchtet mehr, weniger Blitz
end_cell_px = 4            # Zoom-Ende: 1 Plakatzelle = 4 Ausgabepixel (R3) → pixelgenauer Wechsel ins Digitale
# Das Karussell: [Plakatwechsel pro Takt, Anzahl Takte] je Abschnitt, nacheinander. 16 = 16tel (8 fps), 8 = Achtel (4 fps).
# Die Kamera zoomt vom ersten Frame an gleichmaessig (exponentiell = gleich empfundenes Tempo) bis das Plakat fuellt.
# Das Karussell endet immer auf dem letzten Frame; auf welchem Frame es anfaengt, ergibt sich daraus.
cadence = [[16, 3], [8, 1]]
zoom_stepped = false       # true = Kamera springt nur mit den Plakaten (reines Stop-Motion), false = faehrt fluessig

[endcard]
# Digitalteil: ab hier rendert der Rechner in 24 fps weiter (haengt nicht, nur im Video). Das Plakat "klappt" ins
# 9:16-Bild auf: Titelblock gleitet nach oben, QR nach unten, und der Stern kommt vom rechten Rand zurueck
# (der Bumerang kehrt heim), fliegt auf einen zu und wird riesig.
seconds = 4.0              # Laenge des Digitalteils
fly_s = 1.5                # so lange fliegt der Stern heran, gleichzeitig gleitet der Satz
star_end = [0.56, 0.95, 1.5]    # Endlage des Sterns im 9:16-Bild: x, y (Bruchteil), Radius (Bruchteil der Bildbreite)
spin_end_deg = 60          # Drehung waehrend des Anflugs (mindestens), laeuft weich aus, landet mit einem Tal nach oben

[audio]
# Musik v1: Nachbau des Intro-Synths aus IGOR'S THEME (Messung 30.9.: stehender Dur-Akkord = Obertoene 2:3:5 eines
# ~37.8-Hz-Grundtons, jede Spitze dreifach verstimmt → Schwebung ~2.5 s, Rauschplateau ab 500 Hz). Additiv, kein Sample.
root_hz = 37.85            # Grundton der Obertonreihe (gemessen, liegt zwischen D1 = 36.71 und D#1 = 38.89)
detune_cents = [-5, 0, 11] # die drei Stimmen (gemessen an der Aufspaltung der 75.6-Hz-Spitze)
filter_start_hz = 380      # Tiefpass am Videoanfang; oeffnet sich waehrend des Zooms, ganz offen beim Wechsel ins Digitale
tick_db = -20              # Klick pro Plakatwechsel (Stop-Motion), relativ zum Synth; Frame 1 etwas lauter
swoosh_db = -9             # Luftzug beim Loop-Neustart: zieht hinter dem Kopf von rechts nach links (der Stern)
hit_db = -2                # Synth-Hit beim Wechsel ins Digitale

[simulation]
# Nur fuer die Vorschau, solange es keine Fotos gibt: erfundene Waende statt Campus + Restfehler der Entzerrung.
jitter_px = 5              # Versatz des Plakats von Foto zu Foto nach dem Entzerren (Pixel im Endbild)
jitter_rot_deg = 0.35      # Restdrehung von Foto zu Foto

[checks]
# Gates: Verstoesse stehen im report.txt der Version, die Vorschau wird trotzdem gebaut.
flash_max_per_s = 3        # WCAG 2.3.1: hoechstens 3 Blitze pro Sekunde (Blitz = Paar gegenlaeufiger Helligkeitsspruenge)
flash_min_delta = 0.10     # Helligkeitssprung (relative Luminanz 0..1), ab dem ein Wechsel zaehlt
flash_max_area_frac = 0.25 # Flaechenanteil des Bildes, ab dem blitzende Pixel als Verstoss gelten
